name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite pytest pytest-asyncio pytest-cov hypothesis ruff mypy

      - name: Lint check
        working-directory: backend
        run: ruff check . || true

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app || true

      - name: Run Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./proofpath_ci.db
          LLM_MODE: replay
          CORPUS_MODE: demo
          SECRET_KEY: ci-test-secret-key-32chars-secure!
          PYTHONPATH: .
        run: pytest -v

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Type check (TypeScript)
        working-directory: frontend
        run: npm run typecheck

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npx vitest run
