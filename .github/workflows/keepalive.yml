name: Keepalive

on:
  schedule:
    # Ping Render free tier every 14 minutes to prevent sleep
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl --fail --silent --max-time 30 \
            "${{ secrets.API_URL }}/health" || echo "Ping failed (non-fatal)"
        continue-on-error: true
